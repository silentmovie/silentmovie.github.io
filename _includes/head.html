<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{ site.title }}">
  <meta name="theme-color" content="#FFAE42">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}"/>
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}" sizes="250x250" />

  {% seo %}

  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

  <link href="https://use.fontawesome.com/releases/v6.7.2/css/all.css" rel="stylesheet">
  <link href="{{ '/styles.css' | relative_url }}" rel="stylesheet">

  {% assign umami_website_id = site.umami.website_id | default: '' | strip %}
  {% if jekyll.environment == 'production' and umami_website_id != '' %}
  <script defer src="{{ site.umami.script_url | escape }}" data-website-id="{{ umami_website_id | escape }}" data-domains="silentmovie.github.io"></script>
  {% endif %}
</head>
